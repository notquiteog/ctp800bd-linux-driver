name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and print dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcups2-dev libcupsimage2-dev cups cups-filters ghostscript python3
      - name: Build and test without hardware
        run: make test
